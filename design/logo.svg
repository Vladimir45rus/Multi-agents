<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#182741"/>
    </linearGradient>
    <linearGradient id="hex" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4fc1ff"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.38" r="0.6">
      <stop offset="0" stop-color="#4fc1ff" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#4fc1ff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="16" y="16" width="992" height="992" rx="214" fill="url(#bg)"/>
  <rect x="16" y="16" width="992" height="992" rx="214" fill="url(#glow)"/>
  <rect x="16" y="16" width="992" height="992" rx="214" fill="none" stroke="#2b3a55" stroke-width="10"/>

  <!-- hexagon frame: the "studio" (architecture), three vertex nodes = agents -->
  <path d="M822 512 L667 244 L357 244 L202 512 L357 780 L667 780 Z"
        fill="none" stroke="url(#hex)" stroke-width="56" stroke-linejoin="round" stroke-linecap="round"/>

  <circle cx="202" cy="512" r="34" fill="#4fc1ff"/>
  <circle cx="667" cy="244" r="34" fill="#a78bfa"/>
  <circle cx="667" cy="780" r="34" fill="#ec4899"/>

  <!-- terminal prompt ">" -->
  <path d="M404 404 L516 512 L404 620" fill="none" stroke="#f8fafc" stroke-width="56"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- cursor "_" -->
  <path d="M566 604 H688" fill="none" stroke="#ec4899" stroke-width="56" stroke-linecap="round"/>
</svg>
