name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: write

env:
  DATABASE_URL: file:./ci.db
  GH_TOKEN: ${{ github.token }}

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build standalone server and Windows installer
        run: npm run dist
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: release/*.exe
          if-no-files-found: error

      - name: Publish to GitHub Releases
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            TAG="${GITHUB_REF_NAME}"
            gh release create "${TAG}" release/*.exe --title "${TAG}" --generate-notes
          else
            # Rolling pre-release for every main build.
            if gh release view latest >/dev/null 2>&1; then
              gh release delete latest --cleanup-tag --yes
            fi
            gh release create latest release/*.exe \
              --prerelease \
              --title "Latest (main)" \
              --notes "Rolling build from main (${GITHUB_SHA})." \
              --target "${GITHUB_SHA}"
          fi
