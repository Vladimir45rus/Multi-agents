name: Build

on:
  push:
    branches: [main]

permissions:
  contents: write

env:
  DATABASE_URL: file:./ci.db
  GH_TOKEN: ${{ github.token }}

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build standalone server and Windows installer
        run: npm run dist
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}

      - name: Publish rolling build to GitHub Releases
        shell: bash
        run: |
          set -euo pipefail
          if gh release view latest >/dev/null 2>&1; then
            gh release delete latest --cleanup-tag --yes
          fi
          gh release create latest release/*.exe \
            --prerelease \
            --title "Latest (main)" \
            --notes "Rolling build from main (${GITHUB_SHA})." \
            --target "${GITHUB_SHA}"
